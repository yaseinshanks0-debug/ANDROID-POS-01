name: Build Android APK & Windows EXE (Dqnamo POS)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web Application (Vite)
        run: npm run build

      - name: Sync Web Bundle to Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Grant Execute Permission & Ensure Gradle Wrapper
        working-directory: ./android
        run: |
          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.14.3
          fi
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Direct Download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Dqnamo-POS.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dqnamo-POS-APK
          path: Dqnamo-POS.apk
          retention-days: 90

  build-exe:
    name: Build Windows Desktop App (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install Electron & Electron Builder for Windows Packaging
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm install --no-save --legacy-peer-deps electron@33.4.0 electron-builder@25.1.8

      - name: Build Frontend (Vite) & Bundle Embedded Server (esbuild)
        run: |
          npm run build
          npm run server:bundle

      - name: Package Windows Installer & Portable EXE (with Mirror Retry on 504)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          echo "Attempt 1: Building Windows EXE via default Electron CDN..."
          if npx electron-builder --win --x64 --config electron-builder.json --publish never; then
            echo "Windows EXE build succeeded on Attempt 1."
          else
            echo "Attempt 1 encountered a network timeout (504). Retrying with high-availability Electron Mirror..."
            sleep 3
            export ELECTRON_MIRROR="https://npmmirror.com/mirrors/electron/"
            export ELECTRON_BUILDER_BINARIES_MIRROR="https://npmmirror.com/mirrors/electron-builder-binaries/"
            npx electron-builder --win --x64 --config electron-builder.json --publish never
          fi

      - name: Collect Built Windows Executables
        shell: bash
        run: |
          cp release-exe/Dqnamo-POS-Setup.exe ./Dqnamo-POS-Setup.exe
          cp release-exe/Dqnamo-POS-Portable.exe ./Dqnamo-POS-Portable.exe

      - name: Upload Windows EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dqnamo-POS-Windows-EXE
          path: |
            Dqnamo-POS-Setup.exe
            Dqnamo-POS-Portable.exe
          retention-days: 90

  publish-release:
    name: Publish APK & EXE to GitHub Releases
    needs:
      - build-apk
      - build-exe
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: Dqnamo-POS-APK
          path: ./release-assets

      - name: Download Windows EXE Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Dqnamo-POS-Windows-EXE
          path: ./release-assets

      - name: Publish Direct Download Release (APK + EXE)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "Dqnamo POS — Android (.apk) & Windows (.exe) Latest Build"
          body: |
            ### Dqnamo POS — النسخ الجاهزة للتثبيت المباشر (أندرويد `.apk` + ويندوز `.exe`)

            #### 📱 1. نسخة الأندرويد (`Dqnamo-POS.apk`)
            - قم بتحميل الملف **`Dqnamo-POS.apk`** وتثبيته مباشرة على هاتف أو تابلت الأندرويد.
            - يدعم العمل أوفلاين، والنسخ الاحتياطي المحلي، والمزامنة الفورية الحية (Live Wi-Fi Sync) مع جهاز اللابتوب.

            #### 💻 2. نسخة الويندوز لسطح المكتب (`.exe`)
            - **`Dqnamo-POS-Setup.exe`**: معالج التثبيت الرسمي للويندوز (ينشئ اختصاراً على سطح المكتب وقائمة ابدأ).
            - **`Dqnamo-POS-Portable.exe`**: نسخة محمولة تعمل فوراً بمجرد النقر عليها دون الحاجة للتثبيت.
            - تتضمن نسخة الويندوز خادم المزامنة المحلي المدمج تلقائياً (على المنفذ `3000`) لربط تطبيق الأندرويد مع تطبيق الويندوز عبر الواي فاي مباشرة بدون أي إعدادات خارجية.
          files: |
            release-assets/Dqnamo-POS.apk
            release-assets/Dqnamo-POS-Setup.exe
            release-assets/Dqnamo-POS-Portable.exe
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
