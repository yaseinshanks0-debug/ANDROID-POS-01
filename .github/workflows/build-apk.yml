name: Build Android APK (Dqnamo POS)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Dqnamo POS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web Application (Vite)
        run: npm run build

      - name: Sync Web Bundle to Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Grant Execute Permission & Ensure Gradle Wrapper
        working-directory: ./android
        run: |
          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.14.3
          fi
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Direct Download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Dqnamo-POS.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dqnamo-POS-APK
          path: Dqnamo-POS.apk
          retention-days: 90

      - name: Publish Direct Download Release (Latest)
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest-apk
          name: "Dqnamo POS Android APK (Latest Build)"
          body: |
            ### Dqnamo POS — نسخة أندرويد الجاهزة للتثبيت (`.apk`)
            قم بتحميل الملف **`Dqnamo-POS.apk`** أدناه وتثبيته مباشرة على جهاز الأندرويد.
          files: Dqnamo-POS.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
