name: 1. Build & Publish Android APK & AAB (Dqnamo POS)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-publish-android:
    name: Build & Publish Android (.apk & .aab) (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository & Record Commit Hash
        uses: actions/checkout@v4

      - name: Record Git Commit Hash
        run: |
          echo "GIT_COMMIT_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "Building Android APK & AAB from commit: $(git rev-parse HEAD)"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK (API 36)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Clean Previous Build Artifacts & Install Dependencies via npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm run clean
          npm ci --include=optional --legacy-peer-deps --no-audit --no-fund

      - name: 2. Verify Rolldown Linux Native Binding (@rolldown/binding-linux-x64-gnu)
        run: npm run verify:rolldown

      - name: 3a. Run TypeScript Check (npm run lint)
        run: npm run lint

      - name: 3b. Run Unit Test Suite (npm test)
        run: npm test

      - name: 3c. Build Web Application (npm run build)
        run: npm run build

      - name: 4. Restore Pristine Android Binary Assets & Sync Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          elif [ -f "node_modules/@capacitor/cli/assets/android-template.tar.gz" ]; then
            echo "Restoring clean binary gradle-wrapper.jar and PNG icons from Capacitor template..."
            tar -xzf node_modules/@capacitor/cli/assets/android-template.tar.gz -C android gradle/wrapper/gradle-wrapper.jar app/src/main/res
          fi
          npx cap sync android
          test -f android/app/src/main/assets/public/index.html
          test -f android/app/src/main/assets/capacitor.config.json
          test -f android/app/src/main/AndroidManifest.xml

      - name: 5. Ensure Gradle Wrapper Integrity
        working-directory: ./android
        run: |
          if ! jar tf gradle/wrapper/gradle-wrapper.jar > /dev/null 2>&1; then
            echo "Regenerating valid gradle-wrapper.jar..."
            gradle wrapper --gradle-version 8.13 --distribution-type bin
          fi
          sed -i 's/networkTimeout=.*/networkTimeout=120000/g' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/-all\.zip/-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: 6. Build Android APK (assembleDebug) & Release AAB (bundleRelease)
        working-directory: ./android
        run: |
          GRADLE_OPTS="-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"
          export GRADLE_OPTS
          for attempt in 1 2 3; do
            echo "Building Android APK & AAB (Attempt $attempt)..."
            if ./gradlew clean assembleDebug bundleRelease --no-daemon; then
              echo "Android APK & AAB built successfully on attempt $attempt."
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Gradle build failed after 3 attempts."
              exit 1
            fi
            echo "Transient network timeout detected, retrying in 5 seconds..."
            sleep 5
          done

      - name: 7. Verify Android Outputs, Metadata, & Compute SHA256 Checksums
        run: |
          mkdir -p releases/android-v2.5.0
          cp android/app/build/outputs/apk/debug/app-debug.apk Dqnamo-POS-v2.5.0.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Dqnamo-POS.apk
          cp android/app/build/outputs/bundle/release/app-release.aab Dqnamo-POS-v2.5.0.aab
          cp Dqnamo-POS-v2.5.0.apk Dqnamo-POS.apk Dqnamo-POS-v2.5.0.aab releases/android-v2.5.0/
          ls -lh Dqnamo-POS-v2.5.0.apk Dqnamo-POS-v2.5.0.aab
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging Dqnamo-POS-v2.5.0.apk | grep -E "package:|sdkVersion:|targetSdkVersion:"
            "$AAPT" dump badging Dqnamo-POS-v2.5.0.apk | grep "name='com.dqnamo.pos'"
            "$AAPT" dump badging Dqnamo-POS-v2.5.0.apk | grep "versionCode='250'"
            "$AAPT" dump badging Dqnamo-POS-v2.5.0.apk | grep "versionName='2.5.0'"
          fi
          sha256sum Dqnamo-POS-v2.5.0.apk Dqnamo-POS.apk Dqnamo-POS-v2.5.0.aab | tee android-checksums.txt
          cp android-checksums.txt releases/android-v2.5.0/CHECKSUMS-ANDROID.txt

      - name: 8. Upload Android APK & AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dqnamo-POS-Android-APK-AAB
          path: |
            Dqnamo-POS-v2.5.0.apk
            Dqnamo-POS.apk
            Dqnamo-POS-v2.5.0.aab
            android-checksums.txt
          retention-days: 90

      - name: 9. Publish Android Release to Dedicated GitHub Release Path (latest-apk)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "Dqnamo POS v2.5.0 — Android (.apk & .aab) Release"
          body: |
            ### 📱 Dqnamo POS v2.5.0 — إصدار الأندرويد المستقل (`.apk` & `.aab`)
            - **Commit:** `${{ env.GIT_COMMIT_SHA }}`
            - **Application ID:** `com.dqnamo.pos` | **Version:** `2.5.0` (`versionCode: 250`)
            - **`Dqnamo-POS-v2.5.0.apk`** (و`Dqnamo-POS.apk`): نسخة `Debug APK` جاهزة للتثبيت المباشر على هواتف وأجهزة الأندرويد اللوحية.
            - **`Dqnamo-POS-v2.5.0.aab`**: حزمة `Android App Bundle (Release)` غير موقعة (`Unsigned`)؛ تتطلب التوقيع بمفتاح الرفع الخاص بالمالك قبل رفعها إلى Google Play Console.
          files: |
            Dqnamo-POS-v2.5.0.apk
            Dqnamo-POS.apk
            Dqnamo-POS-v2.5.0.aab
            android-checksums.txt
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
