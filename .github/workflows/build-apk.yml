name: 1. Build & Publish Android APK & AAB (D POS)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-publish-android:
    name: Build & Publish Android (.apk & .aab) (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository & Record Commit Hash
        uses: actions/checkout@v4

      - name: Setup Node.js 24 (>=24.12.0)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Record Git Commit Hash & App Version
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          APP_VERSION=$(node -p "require('./package.json').version")
          ANDROID_VERSION_CODE=$(grep -oE 'versionCode[[:space:]]+[0-9]+' android/app/build.gradle | awk '{print $2}' | head -n 1)
          echo "GIT_COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "ANDROID_VERSION_CODE=$ANDROID_VERSION_CODE" >> $GITHUB_ENV
          echo "Building Android APK & AAB v$APP_VERSION (versionCode $ANDROID_VERSION_CODE) from commit: $COMMIT_SHA"

      - name: Verify Node.js, npm, and Lockfile Consistency
        run: |
          node -v
          npm -v
          node -e "
            const fs = require('node:fs');
            const [maj, min] = process.versions.node.split('.').map(Number);
            if (maj < 22) {
              console.error('Node.js >= 22 is required, found:', process.versions.node);
              process.exit(1);
            }
            if (maj < 24 || (maj === 24 && min < 12)) {
              console.warn('Warning: Node.js >= 24.12.0 is recommended for @firebase/* packages; found:', process.versions.node);
            }
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
            const lockRoot = (lock.packages && lock.packages['']) || {};
            const pkgDeps = { ...(pkg.dependencies || {}), ...(pkg.devDependencies || {}) };
            const lockDeps = { ...(lockRoot.dependencies || {}), ...(lockRoot.devDependencies || {}) };
            const missing = Object.keys(pkgDeps).filter((k) => !(k in lockDeps));
            const mismatched = Object.keys(pkgDeps).filter((k) => k in lockDeps && lockDeps[k] !== pkgDeps[k]);
            if (missing.length || mismatched.length) {
              console.error('package.json and package-lock.json are out of sync:', { missing, mismatched });
              process.exit(1);
            }
            console.log('Verified Node.js', process.versions.node, 'and lockfile sync for v' + pkg.version, '(' + Object.keys(pkgDeps).length + ' root dependencies).');
          "

      - name: Setup Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK (API 36)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Clean Previous Build Artifacts & Install Dependencies via npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm run clean
          npm ci --include=optional --legacy-peer-deps --no-audit --no-fund

      - name: 2. Verify Rolldown Linux Native Binding (@rolldown/binding-linux-x64-gnu)
        run: npm run verify:rolldown

      - name: 3a. Run TypeScript Check (npm run lint)
        run: npm run lint

      - name: 3b. Run Unit Test Suite (npm test)
        run: npm test

      - name: 3c. Build Web Application (npm run build)
        run: npm run build

      - name: 4. Restore Gradle Wrapper Binary (Preserving Custom Icons & Resources) & Sync Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          elif [ -f "node_modules/@capacitor/cli/assets/android-template.tar.gz" ] && ! jar tf android/gradle/wrapper/gradle-wrapper.jar > /dev/null 2>&1; then
            echo "Restoring clean binary gradle-wrapper.jar from Capacitor template (preserving custom app/src/main/res)..."
            tar -xzf node_modules/@capacitor/cli/assets/android-template.tar.gz -C android gradle/wrapper/gradle-wrapper.jar
          fi
          npx cap sync android
          test -f android/app/src/main/assets/public/index.html
          test -f android/app/src/main/assets/capacitor.config.json
          test -f android/app/src/main/AndroidManifest.xml

      - name: 5. Ensure Gradle Wrapper Integrity
        working-directory: ./android
        run: |
          if ! jar tf gradle/wrapper/gradle-wrapper.jar > /dev/null 2>&1; then
            echo "Regenerating valid gradle-wrapper.jar..."
            gradle wrapper --gradle-version 8.14.3 --distribution-type bin
          fi
          sed -i 's/networkTimeout=.*/networkTimeout=120000/g' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/-all\.zip/-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: 6. Build Android APK (assembleDebug) & Release AAB (bundleRelease)
        working-directory: ./android
        run: |
          GRADLE_OPTS="-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"
          export GRADLE_OPTS
          for attempt in 1 2 3; do
            echo "Building Android APK & AAB v${APP_VERSION} (Attempt $attempt)..."
            if ./gradlew clean assembleDebug bundleRelease --no-daemon; then
              echo "Android APK & AAB built successfully on attempt $attempt."
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Gradle build failed after 3 attempts."
              exit 1
            fi
            echo "Transient network timeout detected, retrying in 5 seconds..."
            sleep 5
          done

      - name: 7. Verify Android Outputs, Metadata, & Compute SHA256 Checksums
        run: |
          APK_FILE="D-POS-v${APP_VERSION}.apk"
          AAB_FILE="D-POS-v${APP_VERSION}.aab"
          CHECKSUM_FILE="android-checksums-v${APP_VERSION}.txt"
          mkdir -p "releases/android-v${APP_VERSION}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "./${APK_FILE}"
          cp android/app/build/outputs/bundle/release/app-release.aab "./${AAB_FILE}"
          cp "./${APK_FILE}" "./${AAB_FILE}" "releases/android-v${APP_VERSION}/"
          ls -lh "./${APK_FILE}" "./${AAB_FILE}"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "./${APK_FILE}" | grep -E "package:|sdkVersion:|targetSdkVersion:"
            "$AAPT" dump badging "./${APK_FILE}" | grep "name='com.dqnamo.pos'"
            "$AAPT" dump badging "./${APK_FILE}" | grep "versionCode='${ANDROID_VERSION_CODE}'"
            "$AAPT" dump badging "./${APK_FILE}" | grep "versionName='${APP_VERSION}'"
          fi
          sha256sum "${APK_FILE}" "${AAB_FILE}" | tee "${CHECKSUM_FILE}"
          cp "${CHECKSUM_FILE}" "releases/android-v${APP_VERSION}/CHECKSUMS-ANDROID.txt"

      - name: 8. Upload Android APK & AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: D-POS-v${{ env.APP_VERSION }}-Android-APK-AAB
          path: |
            D-POS-v${{ env.APP_VERSION }}.apk
            D-POS-v${{ env.APP_VERSION }}.aab
            android-checksums-v${{ env.APP_VERSION }}.txt
          retention-days: 90

      - name: 9. Publish New Versioned Android Release (v${{ env.APP_VERSION }}-android)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-android
          target_commitish: ${{ github.sha }}
          name: "D POS - Point of Sale v${{ env.APP_VERSION }} — Android (.apk & .aab)"
          body: |
            ### 📱 D POS - Point of Sale v${{ env.APP_VERSION }} — إصدار الأندرويد الجديد المستقل (`.apk` & `.aab`)
            - **Release Tag:** `v${{ env.APP_VERSION }}-android` (إصدار جديد مستقل لا يستبدل الإصدار القديم)
            - **Commit:** `${{ env.GIT_COMMIT_SHA }}`
            - **Application ID:** `com.dqnamo.pos` | **Version:** `${{ env.APP_VERSION }}` (`versionCode: ${{ env.ANDROID_VERSION_CODE }}`)
            - **`D-POS-v${{ env.APP_VERSION }}.apk`**: نسخة `Debug APK` جاهزة للتثبيت المباشر على هواتف وأجهزة الأندرويد اللوحية.
            - **`D-POS-v${{ env.APP_VERSION }}.aab`**: حزمة `Android App Bundle (Release)` غير موقعة (`Unsigned`)؛ تتطلب التوقيع بمفتاح الرفع الخاص بالمالك قبل رفعها إلى Google Play Console.
          files: |
            D-POS-v${{ env.APP_VERSION }}.apk
            D-POS-v${{ env.APP_VERSION }}.aab
            android-checksums-v${{ env.APP_VERSION }}.txt
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
