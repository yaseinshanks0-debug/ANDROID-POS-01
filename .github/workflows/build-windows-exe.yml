name: 2. Build & Publish Windows Desktop EXE (D POS)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-publish-windows:
    name: Build & Publish Windows Desktop (.exe) (windows-latest)
    runs-on: windows-latest

    steps:
      - name: 1. Checkout Repository & Record Commit Hash
        uses: actions/checkout@v4

      - name: Setup Node.js 24 (>=24.12.0)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Record Git Commit Hash & App Version
        shell: bash
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "GIT_COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "Building Windows EXE v$APP_VERSION from commit: $COMMIT_SHA"

      - name: Verify Node.js, npm, and Lockfile Consistency
        shell: bash
        run: |
          node -v
          npm -v
          node -e "
            const fs = require('node:fs');
            const [maj, min] = process.versions.node.split('.').map(Number);
            if (maj < 22) {
              console.error('Node.js >= 22 is required, found:', process.versions.node);
              process.exit(1);
            }
            if (maj < 24 || (maj === 24 && min < 12)) {
              console.warn('Warning: Node.js >= 24.12.0 is recommended for @firebase/* packages; found:', process.versions.node);
            }
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
            const lockRoot = (lock.packages && lock.packages['']) || {};
            const pkgDeps = { ...(pkg.dependencies || {}), ...(pkg.devDependencies || {}) };
            const lockDeps = { ...(lockRoot.dependencies || {}), ...(lockRoot.devDependencies || {}) };
            const missing = Object.keys(pkgDeps).filter((k) => !(k in lockDeps));
            const mismatched = Object.keys(pkgDeps).filter((k) => k in lockDeps && lockDeps[k] !== pkgDeps[k]);
            if (missing.length || mismatched.length) {
              console.error('package.json and package-lock.json are out of sync:', { missing, mismatched });
              process.exit(1);
            }
            console.log('Verified Node.js', process.versions.node, 'and lockfile sync for v' + pkg.version, '(' + Object.keys(pkgDeps).length + ' root dependencies).');
          "

      - name: Clean Old Build Files & Install Dependencies via npm ci
        shell: bash
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm run clean
          npm ci --include=optional --legacy-peer-deps --no-audit --no-fund

      - name: 2. Verify Windows Native Toolchain Bindings (Rolldown, TypeScript, Tailwind Oxide, LightningCSS)
        shell: bash
        run: |
          npm run verify:rolldown
          node -e "
            const fs = require('node:fs');
            const rolldownVer = require('./node_modules/rolldown/package.json').version;
            const rolldownPkg = require('./node_modules/@rolldown/binding-win32-x64-msvc/package.json');
            const rolldownStat = fs.statSync('./node_modules/@rolldown/binding-win32-x64-msvc/rolldown-binding.win32-x64-msvc.node');
            const rolldownMod = require('./node_modules/@rolldown/binding-win32-x64-msvc');
            const tscStat = fs.statSync('./node_modules/@typescript/typescript-win32-x64/lib/tsc.exe');
            const oxideStat = fs.statSync('./node_modules/@tailwindcss/oxide-win32-x64-msvc/tailwindcss-oxide.win32-x64-msvc.node');
            const lcssStat = fs.statSync('./node_modules/lightningcss-win32-x64-msvc/lightningcss.win32-x64-msvc.node');
            console.log('Verified Windows native bindings:', {
              rolldown: { version: rolldownPkg.version, bytes: rolldownStat.size, exports: Object.keys(rolldownMod).length },
              tscExeBytes: tscStat.size,
              oxideBytes: oxideStat.size,
              lightningcssBytes: lcssStat.size
            });
            if (rolldownPkg.version !== rolldownVer || rolldownStat.size <= 0 || !rolldownMod || tscStat.size <= 0 || oxideStat.size <= 0 || lcssStat.size <= 0) {
              process.exit(1);
            }
          "

      - name: 3a. Run TypeScript Check (npm run lint)
        shell: bash
        run: npm run lint

      - name: 3b. Run Unit Tests (npm test)
        shell: bash
        run: npm test

      - name: 3c. Build Frontend (npm run build)
        shell: bash
        run: npm run build

      - name: 3d. Bundle Embedded Server (npm run server:bundle)
        shell: bash
        run: npm run server:bundle

      - name: 3e. Stage UI Assets (npm run exe:stage-ui)
        shell: bash
        run: |
          npm run exe:stage-ui
          cp -r dist/* electron/www/ || true
          sed -i '/^dist/d' .gitignore || true
          sed -i '/^electron\/www/d' .gitignore || true
          test -f electron/www/index.html
          test -f dist-server/server.cjs

      - name: 4. Install Electron Packager & Build Windows Installer/Portable EXE
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          SKIP_BUILD_ARTIFACT_CLEAN: '1'
        run: |
          echo "Installing Electron & Electron Builder after Vite/Rolldown build has already completed..."
          npm install --no-save --legacy-peer-deps --no-audit --no-fund electron@33.4.0 electron-builder@25.1.8
          test -f electron/www/index.html
          test -f dist-server/server.cjs
          echo "Attempt 1: Building Windows EXE v${APP_VERSION} via default Electron CDN..."
          if npx electron-builder --win --x64 --config electron-builder.json --publish never; then
            echo "Windows EXE build succeeded on Attempt 1."
          else
            echo "Attempt 1 encountered a network timeout (504). Retrying with high-availability Electron Mirror..."
            sleep 3
            export ELECTRON_MIRROR="https://npmmirror.com/mirrors/electron/"
            export ELECTRON_BUILDER_BINARIES_MIRROR="https://npmmirror.com/mirrors/electron-builder-binaries/"
            npx electron-builder --win --x64 --config electron-builder.json --publish never
          fi

      - name: 5. Verify Packaged Resources, Smoke-Test Embedded Backend, & Compute SHA256
        shell: bash
        run: |
          echo "Verifying packaged frontend, backend, and seed data inside win-unpacked..."
          SETUP_EXE="D-POS-v${APP_VERSION}-Setup.exe"
          PORTABLE_EXE="D-POS-v${APP_VERSION}-Portable.exe"
          CHECKSUM_FILE="windows-checksums-v${APP_VERSION}.txt"
          mkdir -p "releases/windows-v${APP_VERSION}"
          ls -la release-exe/
          ls -la release-exe/win-unpacked/resources/
          test -f release-exe/win-unpacked/resources/www/index.html
          test -f release-exe/win-unpacked/resources/app/electron/www/index.html
          test -f release-exe/win-unpacked/resources/app/dist-server/server.cjs
          test -d release-exe/win-unpacked/resources/seed-data
          test -f "release-exe/${SETUP_EXE}"
          test -f "release-exe/${PORTABLE_EXE}"
          cp "release-exe/${SETUP_EXE}" "./${SETUP_EXE}"
          cp "release-exe/${PORTABLE_EXE}" "./${PORTABLE_EXE}"
          cp "./${SETUP_EXE}" "./${PORTABLE_EXE}" "releases/windows-v${APP_VERSION}/"
          ls -lh "./${SETUP_EXE}" "./${PORTABLE_EXE}"
          sha256sum "${SETUP_EXE}" "${PORTABLE_EXE}" | tee "${CHECKSUM_FILE}"
          cp "${CHECKSUM_FILE}" "releases/windows-v${APP_VERSION}/CHECKSUMS-WINDOWS.txt"
          echo "Running headless smoke test of packaged Windows server.cjs..."
          WIN_PWD=$(pwd -W 2>/dev/null || pwd)
          NODE_ENV=production PORT=3199 DQNAMO_DIST_DIR="${WIN_PWD}/release-exe/win-unpacked/resources/www" node release-exe/win-unpacked/resources/app/dist-server/server.cjs &
          SRV_PID=$!
          sleep 3
          curl -fsS http://127.0.0.1:3199/api/lan-sync/info
          curl -fsS http://127.0.0.1:3199/ | grep -i "<!doctype html>"
          kill $SRV_PID || true

      - name: 6. Upload Windows EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: D-POS-v${{ env.APP_VERSION }}-Windows-EXE
          path: |
            D-POS-v${{ env.APP_VERSION }}-Setup.exe
            D-POS-v${{ env.APP_VERSION }}-Portable.exe
            windows-checksums-v${{ env.APP_VERSION }}.txt
          retention-days: 90

      - name: 7. Publish New Versioned Windows Release (v${{ env.APP_VERSION }}-windows)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-windows
          target_commitish: ${{ github.sha }}
          name: "D POS - Point of Sale v${{ env.APP_VERSION }} — Windows Desktop (.exe)"
          body: |
            ### 💻 D POS - Point of Sale v${{ env.APP_VERSION }} — إصدار الويندوز الجديد المستقل لسطح المكتب (`.exe`)
            - **Release Tag:** `v${{ env.APP_VERSION }}-windows` (إصدار جديد مستقل لا يستبدل الإصدار القديم)
            - **Commit:** `${{ env.GIT_COMMIT_SHA }}`
            - **App ID:** `com.dqnamo.pos` | **Version:** `${{ env.APP_VERSION }}` (`Windows x64`)
            - **`D-POS-v${{ env.APP_VERSION }}-Setup.exe`**: معالج التثبيت الرسمي لنظام Windows x64 (ينشئ اختصاراً على سطح المكتب وقائمة ابدأ).
            - **`D-POS-v${{ env.APP_VERSION }}-Portable.exe`**: نسخة محمولة تعمل فوراً بمجرد النقر عليها دون الحاجة للتثبيت.
            - تتضمن واجهة النظام الكاملة المدمجة مع خادم المزامنة المحلي (`server.cjs`) والبيانات الأولية.
          files: |
            D-POS-v${{ env.APP_VERSION }}-Setup.exe
            D-POS-v${{ env.APP_VERSION }}-Portable.exe
            windows-checksums-v${{ env.APP_VERSION }}.txt
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
